{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Phytolean{% endblock %}</title>
    <link rel="icon" href="{% static 'main/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="{% static 'main/plugins/slick-master/slick/slick.css' %}" rel="stylesheet"/>
    <link href="{% static 'main/plugins/slick-master/slick/slick-theme.css' %}" rel="stylesheet"/>
    <link href="{% static 'main/css/main.css' %}" rel="stylesheet"/>
    {% block link_extra %}{% endblock %}
    <script src="{% static 'main/plugins/jquery-3.6.0.min.js' %}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" type="text/javascript"></script>
    <script src="{% static 'main/plugins/slick-master/slick/slick.min.js' %}" type="text/javascript"></script>
    {% block script_extra %}{% endblock %}
    <script>
    window.addEventListener('scroll', function() {
        var nav = document.querySelector('.phyto-nav');
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 20);
    });
    </script>
</head>
<body>
{% block content %}
{% endblock %}
</body>
</html>
